<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader - Siputzx API</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #fff;
    }
    .container {
      width: 100%;
      max-width: 800px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 32px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #f58529, #dd2a7b, #8134af);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    .input-group input {
      flex: 1;
      padding: 16px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }
    .input-group input:focus {
      border-color: #dd2a7b;
      box-shadow: 0 0 0 3px rgba(221, 42, 123, 0.2);
    }
    .input-group input::placeholder {
      color: #777;
    }
    .input-group button {
      padding: 0 28px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #f58529, #dd2a7b);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .input-group button:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }
    .input-group button:active {
      transform: scale(0.98);
    }
    .input-group button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .loading {
      text-align: center;
      padding: 30px;
      color: #ccc;
      display: none;
    }
    .loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #dd2a7b;
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error {
      background: rgba(255, 60, 60, 0.15);
      border: 1px solid rgba(255, 60, 60, 0.4);
      color: #ff9b9b;
      padding: 16px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 20px;
      display: none;
    }
    .result {
      display: none;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .author-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255,255,255,0.06);
      padding: 14px 18px;
      border-radius: 16px;
      margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .author-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f58529, #dd2a7b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .author-info p {
      font-size: 0.95rem;
      color: #eee;
    }
    .author-info .label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .desc {
      font-size: 0.9rem;
      color: #bbb;
      margin-bottom: 18px;
      line-height: 1.5;
      word-break: break-word;
    }
    .media-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }
    @media (max-width: 600px) {
      .media-grid { grid-template-columns: 1fr; }
      .input-group { flex-direction: column; }
      .input-group button { padding: 14px; }
    }
    .media-item {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
    }
    .media-item video,
    .media-item img {
      width: 100%;
      display: block;
      background: #000;
      max-height: 220px;
      object-fit: cover;
    }
    .media-item .media-footer {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .media-item .media-footer span {
      font-size: 0.85rem;
      color: #ccc;
      font-weight: 600;
    }
    .btn-download {
      background: linear-gradient(135deg, #f58529, #dd2a7b);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
      white-space: nowrap;
    }
    .btn-download:hover {
      opacity: 0.85;
      transform: scale(1.03);
    }
    .btn-download.audio {
      background: linear-gradient(135deg, #1db954, #14833b);
    }
    .cover-wrap {
      position: relative;
    }
    .cover-wrap .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 0.75rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎵 TikTok Downloader</h1>
    <p class="subtitle">Unduh video, audio, dan gambar TikTok tanpa watermark</p>

    <div class="input-group">
      <input type="url" id="urlInput" placeholder="Tempel link TikTok di sini..." autocomplete="off">
      <button id="downloadBtn" onclick="fetchTikTok()">Download</button>
    </div>

    <div class="error" id="errorBox"></div>

    <div class="loading" id="loadingBox">
      <div class="spinner"></div>
      <p>Mengambil data dari TikTok...</p>
    </div>

    <div class="result" id="resultBox">
      <div class="author-card">
        <div class="author-avatar" id="avatar">?</div>
        <div class="author-info">
          <p class="label">Author</p>
          <p id="authorName">-</p>
        </div>
      </div>

      <p class="desc" id="descText"></p>

      <div class="media-grid" id="mediaGrid"></div>

      <div class="media-grid" id="audioGrid"></div>

      <p class="footer-note">Data diambil dari API Siputzx • Link download dapat kedaluwarsa</p>
    </div>
  </div>

  <script>
    const API_URL = 'https://api.siputzx.my.id/api/d/tiktok';
    const loadingBox = document.getElementById('loadingBox');
    const errorBox = document.getElementById('errorBox');
    const resultBox = document.getElementById('resultBox');
    const mediaGrid = document.getElementById('mediaGrid');
    const audioGrid = document.getElementById('audioGrid');
    const downloadBtn = document.getElementById('downloadBtn');
    const urlInput = document.getElementById('urlInput');

    // Inisialisasi avatar dengan huruf pertama author
    function setAvatar(name) {
      const initial = name ? name.charAt(0).toUpperCase() : '?';
      document.getElementById('avatar').textContent = initial;
    }

    // Helper untuk membuat elemen media card
    function createMediaCard(type, label, url, poster) {
      const card = document.createElement('div');
      card.className = 'media-item';

      let mediaEl;
      if (type === 'video') {
        mediaEl = document.createElement('video');
        mediaEl.controls = true;
        mediaEl.src = url;
        if (poster) mediaEl.poster = poster;
      } else if (type === 'image') {
        mediaEl = document.createElement('img');
        mediaEl.src = url;
        mediaEl.alt = label;
      } else if (type === 'audio') {
        mediaEl = document.createElement('audio');
        mediaEl.controls = true;
        mediaEl.src = url;
        mediaEl.style.width = '100%';
        mediaEl.style.padding = '12px';
      }

      if (mediaEl) card.appendChild(mediaEl);

      const footer = document.createElement('div');
      footer.className = 'media-footer';

      const span = document.createElement('span');
      span.textContent = label;
      footer.appendChild(span);

      const a = document.createElement('a');
      a.className = 'btn-download' + (type === 'audio' ? ' audio' : '');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.download = '';
      a.textContent = '⬇ Download';
      footer.appendChild(a);

      card.appendChild(footer);
      return card;
    }

    // Fungsi utama fetch data
    async function fetchTikTok() {
      const url = urlInput.value.trim();
      if (!url) {
        showError('Masukkan link TikTok terlebih dahulu.');
        return;
      }
      if (!url.includes('tiktok.com')) {
        showError('Link harus berasal dari tiktok.com');
        return;
      }

      // Reset tampilan
      errorBox.style.display = 'none';
      resultBox.style.display = 'none';
      loadingBox.style.display = 'block';
      downloadBtn.disabled = true;
      mediaGrid.innerHTML = '';
      audioGrid.innerHTML = '';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url })
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const json = await response.json();

        if (!json.status || !json.data) {
          throw new Error(json.message || 'Gagal mengambil data dari API.');
        }

        const data = json.data;

        // Validasi minimal ada video atau gambar
        const hasVideo = data.video && (data.video.hd?.url || data.video.sd?.url || data.video.watermark?.url);
        const hasImages = data.images && data.images.length > 0;

        if (!hasVideo && !hasImages) {
          throw new Error('Tidak ada media yang bisa diunduh dari link ini.');
        }

        // Isi author
        const author = data.author || data.username || 'Tidak diketahui';
        document.getElementById('authorName').textContent = author;
        setAvatar(author);

        // Isi deskripsi
        const desc = data.description || 'Tanpa deskripsi';
        document.getElementById('descText').textContent = desc;

        const cover = data.cover || null;

        // Render video
        if (data.video) {
          const v = data.video;
          if (v.hd?.url) {
            mediaGrid.appendChild(createMediaCard('video', 'Video HD (No Watermark)', v.hd.url, cover));
          }
          if (v.sd?.url) {
            mediaGrid.appendChild(createMediaCard('video', 'Video SD (No Watermark)', v.sd.url, cover));
          }
          if (v.watermark?.url) {
            mediaGrid.appendChild(createMediaCard('video', 'Video + Watermark', v.watermark.url, cover));
          }
        }

        // Render gambar (jika ada, misal slideshow)
        if (hasImages) {
          data.images.forEach((imgUrl, idx) => {
            mediaGrid.appendChild(createMediaCard('image', `Gambar ${idx + 1}`, imgUrl, null));
          });
        }

        // Render audio
        if (data.music?.url) {
          const audioCard = createMediaCard('audio', 'Audio / Musik', data.music.url, null);
          audioGrid.appendChild(audioCard);
        }

        // Tampilkan hasil
        resultBox.style.display = 'block';

      } catch (err) {
        console.error(err);
        showError(err.message || 'Terjadi kesalahan saat memproses. Coba lagi.');
      } finally {
        loadingBox.style.display = 'none';
        downloadBtn.disabled = false;
      }
    }

    function showError(msg) {
      errorBox.textContent = '⚠️ ' + msg;
      errorBox.style.display = 'block';
    }

    // Bisa tekan Enter di input
    urlInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        fetchTikTok();
      }
    });
  </script>
</body>
</html>
